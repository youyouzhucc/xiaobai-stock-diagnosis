name: daily-scores

on:
  schedule:
    # GitHub 用 UTC：04:05 UTC = 北京时间 12:05，只跑工作日（周末没有新行情）
    - cron: '5 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 计算今日综合分快照与全市场估值排名
        run: node scripts/build-scores.mjs

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scores.json data/ranks.json data/boards.json data/ipo.json
          if git diff --staged --quiet; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "chore(scores): $(date -u +%Y-%m-%d) 综合分与估值排名快照"
            git push
          fi
